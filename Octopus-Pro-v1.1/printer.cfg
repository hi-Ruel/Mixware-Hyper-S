#######################
## 2nd July 2026 Octopus Pro v1.1 to Mixware Hyper-S
#######################
# Specs:
# - Octopus Pro v1.1
# - TMC2209 UART
# - Sensorless Homing X and Y
# - Z home with Probe
#
# Generic Octopus Pro v1.1 https://github.com/Klipper3d/klipper/blob/master/config/generic-bigtreetech-octopus-pro-v1.1.cfg
# 
# Link to current version of this config: https://github.com/hi-Ruel/Mixware-Hyper-S/Octopus-Pro-v1.1/printer.cfg
# Klipper config reference: https://www.klipper3d.org/Config_Reference.html
# Gcode templates syntax: https://jinja.palletsprojects.com/en/2.10.x/templates/
# Gcode math: https://manual.slic3r.org/advanced/conditional-gcode


[mcu]
# Replace with your actual device ID if using USB
# serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_...-if00
# If using UART/USART2, use: serial: /dev/ttyAMA0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 5000
max_z_velocity: 5
max_z_accel: 100

#######################
## X AXIS
## https://github.com/KevinOConnor/klipper/blob/master/docs/Rotation_Distance.md
#######################

[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 16
homing_speed: 25
homing_retract_dist: 0
position_min: 0
position_max: 300
position_endstop: 0
# Use virtual endstop for sensorless homing
endstop_pin: tmc2209_stepper_x:virtual_endstop

[tmc2209 stepper_x]
uart_pin: PC4
# DIAG pin for X axis on Octopus Pro V1.1
diag_pin: ^PG6
interpolate: True
run_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 999999
driver_SGTHRS: 150			# Sensitivity 255 is Max / Zero is Low. 150 is default
# hold_current: 0.950
# https://github.com/KevinOConnor/klipper/issues/1363


#######################
## Y AXIS
## https://github.com/KevinOConnor/klipper/blob/master/docs/Rotation_Distance.md
#######################

[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
rotation_distance: 40
microsteps: 16
homing_speed: 25
homing_retract_dist: 0
position_min: 0
position_max: 300
position_endstop: 0
endstop_pin: tmc2209_stepper_y:virtual_endstop

[tmc2209 stepper_y]
uart_pin: PD11
# DIAG pin for Y axis on Octopus Pro V1.1
diag_pin: ^PG9
interpolate: True
run_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 999999
driver_SGTHRS: 150			# Sensitivity 255 is Max / Zero is Low. 150 is default
# hold_current: 0.950
# https://github.com/KevinOConnor/klipper/blob/master/docs/Endstop_Phase.md

# [endstop_phase stepper_z]
# trigger_phase=9/64


#######################
## Z AXIS
## https://github.com/KevinOConnor/klipper/blob/master/docs/Rotation_Distance.md
#######################

[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
microsteps: 16
rotation_distance: 8
#endstop_pin: ^PG10			# Mechanical end stop
endstop_pin: probe:z_virtual_endstop 	# BLTouch as end stop
# position_endstop: 0.5			# Mechanical end stop
position_max: 350
homing_speed: 50

[tmc2209 stepper_z]
uart_pin: PC6
run_current: 0.650
# diag_pin: PG10
# https://github.com/KevinOConnor/klipper/issues/1363

# https://github.com/KevinOConnor/klipper/blob/master/docs/Endstop_Phase.md
# [endstop_phase stepper_z]
# trigger_phase=9/64


#######################
## EXTRUDER
#######################

# Driver4: Extruder
[extruder]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA2
sensor_pin: PF4
sensor_type: EPCOS 100K B57560G104F
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 250

[tmc2209 extruder]
uart_pin: PF2
run_current: 0.800


#######################
## HEATER BED
#######################

[heater_bed]
heater_pin: PA1
sensor_pin: PF3
sensor_type: Generic 3950
min_temp: 0
max_temp: 120


#######################
## PROBE
#######################

[bltouch]
sensor_pin: ^PB7		# Probe output signal
control_pin: PB6		# Servo control pin
pin_move_time: 0.6		# Time to deploy/retract (seconds)
speed: 5.0			# Probe speed
lift_speed: 10.0			# Lift speed after probe
samples: 1			# Number of samples per point
sample_retract_dist: 3.0
samples_result: median
samples_tolerance: 0.05
samples_tolerance_retries: 3

[probe]
# Optional: Define probe offsets if using the [probe] section for bed mesh
x_offset: 0			# If the BLTouch is to the left of the nozzle (X-axis), the x_offset is negative. 
y_offset: -30			# If it is behind the nozzle (Y-axis), the y_offset is typically negative
z_offset: 0


#######################
## MISC
#######################

[safe_z_home]
home_xy_position: 150, 150	# Replace with your bed's center or probe-safe location
speed: 50			# Speed (mm/s) to move to the safe home position
z_hop: 10			# Distance (mm) to lift Z before homing to avoid collisions
z_hop_speed: 5			# Speed (mm/s) for the Z hop

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

