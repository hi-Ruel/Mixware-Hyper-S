#######################
## SMART PLUG POWER TP LINK KP303
#######################

[power printer_plug]
type: tplink_smartplug
address: 192.168.100.x				# TPLink KP303 set to STATIC IP
output_id: 0					# Port which printer is plugged in to - DO NOT MOVE
restart_klipper_when_powered: True
restart_delay: 3
port: 9999
off_when_shutdown: True
on_when_job_queued: True
locked_while_printing: True

