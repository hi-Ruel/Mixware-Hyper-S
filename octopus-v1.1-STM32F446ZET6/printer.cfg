#######################
## 3rd July 2026 Octopus v1.1 to Mixware Hyper-S
#######################
# Specs:
# - Octopus v1.1
# - TMC2209 UART
# - Sensorless Homing X and Y
# - Z home with Probe
# - Adaptive Mesh and Kamp https://github.com/kyleisah/Klipper-Adaptive-Meshing-Purging
# - Smart Plug control TPLink KP303
# 
# Link to current version of this config: https://github.com/hi-Ruel/Mixware-Hyper-S/octopus-v1.1-STM32F446ZET6/printer.cfg
# 
# Generic Octopus v1.1 https://github.com/Klipper3d/klipper/blob/master/config/generic-bigtreetech-octopus-v1.1.cfg
# Klipper config reference: https://www.klipper3d.org/Config_Reference.html
# Gcode templates syntax: https://jinja.palletsprojects.com/en/2.10.x/templates/
# Gcode math: https://manual.slic3r.org/advanced/conditional-gcode
#######################


[mcu]
serial: /dev/serial/by-id/usb-Klipper_Klipper_firmware_12345-if00	# REPLACE WITH YOUR OWN MCU
# Replace with your actual device ID if using USB
# serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_...-if00
# If using UART/USART2, use: serial: /dev/ttyAMA0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 5000
max_z_velocity: 5
max_z_accel: 100

#######################
## X AXIS
## https://github.com/KevinOConnor/klipper/blob/master/docs/Rotation_Distance.md
#######################

[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 16
homing_speed: 50
homing_retract_dist: 0
position_min: 0
position_max: 300
position_endstop: 0
endstop_pin: tmc2209_stepper_x:virtual_endstop	# Sensorless homing
#endstop_pin: PG6					# Mechanical ENDSTOP pin

[tmc2209 stepper_x]
uart_pin: PC4
# DIAG pin for X axis on Octopus Pro V1.1
diag_pin: ^PG6
interpolate: True
run_current: 0.7
sense_resistor: 0.110
stealthchop_threshold: 999999
driver_SGTHRS: 150					# Sensitivity 255 is Max / Zero is Low. 150 is default
# hold_current: 0.950
# https://github.com/KevinOConnor/klipper/issues/1363


#######################
## Y AXIS
## https://github.com/KevinOConnor/klipper/blob/master/docs/Rotation_Distance.md
#######################

[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
rotation_distance: 40
microsteps: 16
homing_speed: 50
homing_retract_dist: 0
position_min: 0
position_max: 300
position_endstop: 0
endstop_pin: tmc2209_stepper_y:virtual_endstop	# Sensorless homing
# endstop_pin: PG9					# Mechanical ENDSTOP pin

[tmc2209 stepper_y]
uart_pin: PD11
# DIAG pin for Y axis on Octopus Pro V1.1
diag_pin: ^PG9
interpolate: True
run_current: 0.7
sense_resistor: 0.110
stealthchop_threshold: 999999
driver_SGTHRS: 150					# Sensitivity 255 is Max / Zero is Low. 150 is default
# hold_current: 0.950
# https://github.com/KevinOConnor/klipper/blob/master/docs/Endstop_Phase.md

# [endstop_phase stepper_z]
# trigger_phase=9/64


#######################
## Z AXIS
## https://github.com/KevinOConnor/klipper/blob/master/docs/Rotation_Distance.md
#######################

[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
microsteps: 16
rotation_distance: 8
# endstop_pin: ^PG10			# Mechanical ENDSTOP
endstop_pin: probe:z_virtual_endstop 	# BLTouch as ENDSTOP
# position_endstop: 0.5			# Mechanical ENDSTOP
position_max: 350
homing_speed: 25

[tmc2209 stepper_z]
uart_pin: PC6
run_current: 0.650
# diag_pin: PG10
# https://github.com/KevinOConnor/klipper/issues/1363

# https://github.com/KevinOConnor/klipper/blob/master/docs/Endstop_Phase.md
# [endstop_phase stepper_z]
# trigger_phase=9/64


#######################
## EXTRUDER
#######################

# Driver4: Extruder
[extruder]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA2
sensor_pin: PF4
sensor_type: EPCOS 100K B57560G104F
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 250

[tmc2209 extruder]
uart_pin: PF2
run_current: 0.800


#######################
## HEATER BED
#######################

[heater_bed]
heater_pin: PA1
sensor_pin: PF3
sensor_type: Generic 3950
min_temp: 0
max_temp: 120


#######################
## PROBE
#######################

[bltouch]
#sensor_pin: ^PB7		# Probe output signal factory location, with a mechanical ENDSTOP (probe penis)
sensor_pin: PG10		# Probe as ENDSTOP
control_pin: PB6		# Servo control pin (main board)
pin_move_time: 0.6		# Time to deploy/retract (seconds)
speed: 5.0			# Probe speed
lift_speed: 10.0			# Lift speed after probe
samples: 1			# Number of samples per point
sample_retract_dist: 3.0
samples_result: median
samples_tolerance: 0.05
samples_tolerance_retries: 3

[probe]
# Optional: Define probe offsets if using the [probe] section for bed mesh
x_offset: 0			# If the BLTouch is to the left of the nozzle (X-axis), the x_offset is negative. 
y_offset: -30			# If it is behind the nozzle (Y-axis), the y_offset is typically negative
z_offset: 0


#######################
## ONLY FANS
#######################

[controller_fan mcu_fan]		# Octopus v1.1 FAN 1 motherboard fan - REMEMBER TO SET TO 24V
pin: PD15
max_power: 1.0
fan_speed: 1.0
kick_start_time: 0.5
heater: extruder
stepper: stepper_x, stepper_y, stepper_z
idle_timeout: 30   

# [controller_fan mcu_fan]		# Octopus v1.1 FAN 2 motherboard fan - REMEMBER TO SET TO 24V
# pin: PD14
# max_power: 1.0
# fan_speed: 1.0
# kick_start_time: 0.5
# heater: extruder
# stepper: stepper_x, stepper_y, stepper_z
# idle_timeout: 30   

[heater_fan hotend_fan]		# Hot End fan - REMEMBER TO SET TO 24V
pin: PA8
kick_start_time: 0.5

[fan]					# Part Cooling fan 1 - REMEMBER TO SET TO 24V
pin: PE5
kick_start_time: 0.5

# [fan]					# Part Cooling fan 2 - REMEMBER TO SET TO 24V
# pin: PD12
# kick_start_time: 0.5


#######################
## MACROS
#######################

[safe_z_home]
home_xy_position: 150, 150	# Replace with your bed's center or probe-safe location
speed: 50			# Speed (mm/s) to move to the safe home position
z_hop: 10			# Distance (mm) to lift Z before homing to avoid collisions
z_hop_speed: 5			# Speed (mm/s) for the Z hop

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

# [input_shaper]
# shaper_type_x: mzv
# shaper_freq_x: 54.6
# shaper_type_y: mzv
# shaper_freq_y: 68.8

# [force_move]
# enable_force_move: False
#  Set to true to enable FORCE_MOVE and SET_KINEMATIC_POSITION
#  extended G-Code commands. The default is false.


#######################
## PRINT START AND END
#######################

# [gcode_macro PRINT_START]
#   Use PRINT_START for the slicer starting script - please customise for your slicer of choice
# gcode:
#     G32                            ; home all axes
#     G1 Z20 F3000                   ; move nozzle away from bed

# [gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
# gcode:
#     M400                           ; wait for buffer to clear
#     G92 E0                         ; zero the extruder
#     G1 E-10.0 F3600                ; retract filament
#     G91                            ; relative positioning
#     G0 Z1.00 X20.0 Y20.0 F20000    ; move nozzle to remove stringing
#     TURN_OFF_HEATERS
#     M107                           ; turn off fan
#     G1 Z2 F3000                    ; move nozzle up 2mm
#     G90                            ; absolute positioning
#     G0  X125 Y250 F3600            ; park nozzle at rear
#     BED_MESH_CLEAR


#######################
## ADAPTIVE BEDMESH
#######################

# [exclude_object]		# Adaptive Mesh https://github.com/kyleisah/Klipper-Adaptive-Meshing-Purging
